[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tailor"
version = "0.1.0"
description = "Match a job posting against evidence from your own corpus, and draft only what the evidence supports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zorigtbaatar Khasbaatar", email = "zk2380@nyu.edu" }]
keywords = ["llm", "rag", "retrieval", "agents", "evals", "grounding", "hybrid search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.15,<0.16"]

[project.urls]
Repository = "https://github.com/ZorigoKH/tailor"

[tool.hatch.build.targets.wheel]
packages = ["src/tailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
